<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fridge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- =========================
       ログイン画面
       ========================= -->
    <div id="loginScreen">
        <div class="card login">
            <h1>🧊 Fridge</h1>
            <h3>誰が使いますか？</h3>
            <div class="user-buttons">
                <button class="user-button" data-user="お父さん">👨 お父さん</button>
                <button class="user-button" data-user="お母さん">👩 お母さん</button>
                <button class="user-button" data-user="お兄ちゃん1">😃お兄ちゃん</button>
                <button class="user-button" data-user="お兄ちゃん2">😁お兄ちゃん</button>
                <button class="user-button" data-user="お姉ちゃん">😅お姉ちゃん</button>
            </div>
            <button id="loginButton" class="login-button">
                ログイン
            </button>
        </div>
    </div>
    <!-- =========================
       メイン
       ========================= -->
    <div id="app" class="hidden">
        <header>
            <div>
                <h1>🧊 Fridge</h1>
                <div id="currentUser" class="current-user"></div>
            </div>
            <button id="logoutButton" class="logout">
                ログアウト
            </button>
        </header>
        <main>
            <!-- =========================
           食品追加
           ========================= -->
            <div class="card">
                <h2>＋ 食品を追加</h2>
                <label for="foodName">
                    食品名
                </label>
                <input id="foodName" type="text" placeholder="例：卵">
                <!-- 保存場所 -->
                <label>
                    保存場所
                </label>
                <div class="storage-buttons">
                    <button id="fridgeButton" class="storage-button selected" data-storage="fridge">
                        🧊 冷蔵庫
                    </button>
                    <button id="freezerButton" class="storage-button" data-storage="freezer">
                        ❄️ 冷凍庫
                    </button>
                </div>
                <!-- 個数 -->
                <label for="quantity">
                    個数
                </label>
                <input id="quantity" type="number" min="0" value="1">
                <!-- グラム -->
                <label for="grams">
                    グラム数
                </label>
                <input id="grams" type="number" min="0" placeholder="例：300">
                <!-- 期限 -->
                <label>
                    期限
                </label>
                <div class="date-buttons">
                    <button id="bestBeforeButton" class="date-button">
                        <span class="date-title">
                            賞味期限
                        </span>
                        <span id="bestBeforeText" class="date-value">
                            未設定
                        </span>
                    </button>
                    <button id="useByButton" class="date-button">
                        <span class="date-title">
                            消費期限
                        </span>
                        <span id="useByText" class="date-value">
                            未設定
                        </span>
                    </button>
                </div>
                <button id="addButton" class="add-button">
                    冷蔵庫に追加
                </button>
            </div>
            <!-- =========================
           冷蔵庫
           ========================= -->
            <div class="card">
                <div class="storage-title">
                    <div>
                        <span class="storage-icon">🥦</span>
                        <div>
                            <h2>冷蔵庫</h2>
                            <span id="fridgeCount" class="food-count">
                                0個
                            </span>
                        </div>
                    </div>
                </div>
                <div id="fridgeFoods"></div>
            </div>
            <!-- =========================
           冷凍庫
           ========================= -->
            <div class="card">
                <div class="storage-title">
                    <div>
                        <span class="storage-icon">🧊</span>
                        <div>
                            <h2>冷凍庫</h2>
                            <span id="freezerCount" class="food-count">
                                0個
                            </span>
                        </div>
                    </div>
                </div>
                <div id="freezerFoods"></div>
            </div>
        </main>
    </div>
    <!-- =========================
       日付モーダル
       ========================= -->
    <div id="dateModal" class="modal-background hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">
                    賞味期限
                </h2>
                <button id="closeModal" class="modal-close">
                    閉じる
                </button>
            </div>
            <div class="wheel-container">
                <div id="yearWheel" class="wheel"></div>
                <div id="monthWheel" class="wheel"></div>
                <div id="dayWheel" class="wheel"></div>
                <div class="wheel-selection"></div>
                <div class="wheel-fade"></div>
            </div>
            <div class="modal-buttons">
                <button id="clearDate" class="clear-button">
                    期限なし
                </button>
                <button id="saveDate" class="save-date-button">
                    設定
                </button>
            </div>
        </div>
    </div>
    <!-- =========================
       削除モーダル
       ========================= -->
    <div id="deleteModal" class="modal-background hidden">
        <div class="modal delete-modal">
            <div class="delete-icon">
                🗑️
            </div>
            <h2>
                食品を削除
            </h2>
            <p id="deleteMessage">
                この食品を削除しますか？
            </p>
            <div class="delete-modal-buttons">
                <button id="cancelDelete" class="cancel-delete">
                    キャンセル
                </button>
                <button id="confirmDelete" class="confirm-delete">
                    削除する
                </button>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
