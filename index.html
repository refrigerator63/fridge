<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Fridge</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fa;

      color: #222;

    }


    header {

      background: white;

      padding: 16px 20px;

      border-bottom: 1px solid #ddd;

      display: flex;

      justify-content: space-between;

      align-items: center;

      position: sticky;

      top: 0;

      z-index: 10;

    }


    header h1 {

      margin: 0;

      font-size: 22px;

    }


    main {

      max-width: 900px;

      margin: auto;

      padding: 20px;

    }


    .hidden {

      display: none !important;

    }


    .card {

      background: white;

      border-radius: 16px;

      padding: 20px;

      margin-bottom: 20px;

      box-shadow:
        0 3px 15px rgba(0, 0, 0, 0.05);

    }


    /* =========================
       ログイン
       ========================= */

    .login {

      max-width: 420px;

      margin: 80px auto;

      text-align: center;

    }


    .login h1 {

      font-size: 32px;

      margin-bottom: 5px;

    }


    .user-buttons {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 20px;

    }


    .user-button {

      background: #f1f3f5;

      color: #222;

      border: 2px solid transparent;

      padding: 18px 10px;

      border-radius: 14px;

      cursor: pointer;

      font-size: 16px;

      margin: 0;

    }


    .user-button.selected {

      border-color: #222;

      background: #fff;

    }


    .login-button {

      margin-top: 20px;

      background: #222;

      color: white;

    }


    /* =========================
       入力フォーム
       ========================= */

    input,
    select,
    button {

      width: 100%;

      padding: 12px;

      border-radius: 10px;

      border: 1px solid #ccc;

      font-size: 16px;

    }


    button {

      border: none;

      background: #222;

      color: white;

      cursor: pointer;

    }


    button:hover {

      opacity: 0.85;

    }


    label {

      display: block;

      font-size: 14px;

      margin-top: 8px;

      margin-bottom: 4px;

      color: #555;

    }


    /* =========================
       冷蔵庫
       ========================= */

    .fridge-section {

      margin-bottom: 35px;

    }


    .fridge-section h2 {

      margin-bottom: 8px;

    }


    .capacity-label {

      display: flex;

      justify-content: space-between;

      font-size: 13px;

      color: #666;

      margin-bottom: 5px;

    }


    .progress {

      height: 12px;

      background: #e5e7eb;

      border-radius: 999px;

      overflow: hidden;

      margin-bottom: 15px;

    }


    .progress-bar {

      height: 100%;

      background: #222;

      transition: width 0.3s;

    }


    /* =========================
       食品
       ========================= */

    .food {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      border: 1px solid #eee;

      padding: 14px;

      border-radius: 12px;

      margin-bottom: 8px;

      background: white;

    }


    .food-name {

      font-weight: bold;

      font-size: 17px;

    }


    .food-info {

      font-size: 13px;

      color: #666;

      margin-top: 4px;

      line-height: 1.6;

    }


    .delete {

      width: auto;

      min-width: 55px;

      background: #eee;

      color: #c00;

      padding: 8px 12px;

      margin: 0;

      flex-shrink: 0;

    }


    .expired {

      color: #d00;

      font-weight: bold;

    }


    .warning {

      color: #d97706;

      font-weight: bold;

    }


    .empty {

      color: #999;

      text-align: center;

      padding: 15px;

    }


    .current-user {

      font-size: 13px;

      color: #666;

    }


    .logout {

      width: auto;

      padding: 8px 12px;

      background: #eee;

      color: #222;

      margin: 0;

    }


    @media (max-width: 600px) {

      main {

        padding: 12px;

      }


      .food {

        align-items: flex-start;

      }


      .food-name {

        font-size: 16px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       ログイン画面
       ===================================== -->

  <div id="loginScreen">


    <div class="card login">


      <h1>🧊 My Fridge</h1>

      <p>
        家族用冷蔵庫管理システム
      </p>


      <h3>
        誰が使いますか？
      </h3>


      <div class="user-buttons">


        <button
          class="user-button"
          data-user="お父さん"
        >
          👨 お父さん
        </button>


        <button
          class="user-button"
          data-user="お母さん"
        >
          👩 お母さん
        </button>


        <button
          class="user-button"
          data-user="自分"
        >
          🧑 自分
        </button>


        <button
          class="user-button"
          data-user="その他"
        >
          👤 その他
        </button>


      </div>


      <button
        id="loginButton"
        class="login-button"
      >
        ログイン
      </button>


    </div>

  </div>



  <!-- =====================================
       アプリ本体
       ===================================== -->

  <div
    id="app"
    class="hidden"
  >


    <header>


      <div>

        <h1>
          🧊 My Fridge
        </h1>

        <div
          id="currentUser"
          class="current-user"
        ></div>

      </div>


      <button
        id="logoutButton"
        class="logout"
      >
        ログアウト
      </button>


    </header>



    <main>


      <!-- =================================
           食品追加
           ================================= -->

      <div class="card">


        <h2>
          ＋ 食品を追加
        </h2>


        <input
          id="foodName"
          type="text"
          placeholder="食品名（例：卵）"
        >


        <label>
          個数
        </label>

        <input
          id="quantity"
          type="number"
          min="1"
          value="1"
        >


        <label>
          保存場所
        </label>

        <select id="location">

          <option value="冷蔵室">
            🧊 冷蔵室
          </option>

          <option value="冷凍室">
            ❄️ 冷凍室
          </option>

          <option value="野菜室">
            🥬 野菜室
          </option>

        </select>


        <label>
          賞味期限
        </label>

        <input
          id="bestBefore"
          type="date"
        >


        <label>
          消費期限
        </label>

        <input
          id="useBy"
          type="date"
        >


        <label>
          大きさ
        </label>

        <select id="size">

          <option value="small">
            小
          </option>

          <option value="medium">
            中
          </option>

          <option value="large">
            大
          </option>

        </select>


        <button id="addButton">
          冷蔵庫に追加
        </button>


      </div>



      <!-- =================================
           冷蔵室
           ================================= -->

      <section class="fridge-section">


        <h2>
          🧊 冷蔵室
        </h2>


        <div class="capacity-label">

          <span>
            推定充満率
          </span>

          <span id="coldRate">
            0%
          </span>

        </div>


        <div class="progress">

          <div
            id="coldBar"
            class="progress-bar"
            style="width: 0%"
          ></div>

        </div>


        <div id="coldFoods"></div>


      </section>



      <!-- =================================
           冷凍室
           ================================= -->

      <section class="fridge-section">


        <h2>
          ❄️ 冷凍室
        </h2>


        <div class="capacity-label">

          <span>
            推定充満率
          </span>

          <span id="freezerRate">
            0%
          </span>

        </div>


        <div class="progress">

          <div
            id="freezerBar"
            class="progress-bar"
            style="width: 0%"
          ></div>

        </div>


        <div id="freezerFoods"></div>


      </section>



      <!-- =================================
           野菜室
           ================================= -->

      <section class="fridge-section">


        <h2>
          🥬 野菜室
        </h2>


        <div class="capacity-label">

          <span>
            推定充満率
          </span>

          <span id="vegetableRate">
            0%
          </span>

        </div>


        <div class="progress">

          <div
            id="vegetableBar"
            class="progress-bar"
            style="width: 0%"
          ></div>

        </div>


        <div id="vegetableFoods"></div>


      </section>


    </main>


  </div>



  <!-- =====================================
       Firebase
       ===================================== -->

  <script type="module">


    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



    // =====================================
    // Firebase設定
    // =====================================

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyB8DRhjiburjP3jKn4wDW2dmdLi843L0go",
  authDomain: "fridge-68cfc.firebaseapp.com",
  projectId: "fridge-68cfc",
  storageBucket: "fridge-68cfc.firebasestorage.app",
  messagingSenderId: "492169932952",
  appId: "1:492169932952:web:ba607e6e5d0db4700aa0ed",
  measurementId: "G-66TKL6ENX8"
};



    // Firebase開始

    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);



    // =====================================
    // 現在ログインしている人
    // =====================================

    let currentUser =
      localStorage.getItem("fridgeUser");



    // =====================================
    // HTML要素
    // =====================================

    const loginScreen =
      document.getElementById("loginScreen");


    const appScreen =
      document.getElementById("app");


    const currentUserText =
      document.getElementById("currentUser");



    // =====================================
    // 名前選択
    // =====================================

    const userButtons =
      document.querySelectorAll(
        ".user-button"
      );


    userButtons.forEach(button => {


      button.addEventListener(
        "click",
        () => {


          // 他の選択を解除

          userButtons.forEach(
            b => b.classList.remove(
              "selected"
            )
          );


          // 選択

          button.classList.add(
            "selected"
          );


          currentUser =
            button.dataset.user;

        }
      );

    });



    // =====================================
    // ログイン
    // =====================================

    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        () => {


          if (!currentUser) {

            alert(
              "名前を選択してください"
            );

            return;

          }


          localStorage.setItem(
            "fridgeUser",
            currentUser
          );


          showApp();

        }
      );



    // =====================================
    // アプリ表示
    // =====================================

    function showApp() {


      loginScreen.classList.add(
        "hidden"
      );


      appScreen.classList.remove(
        "hidden"
      );


      currentUserText.textContent =
        `ログイン中：${currentUser}`;


      startRealtimeListener();

    }



    // =====================================
    // ログアウト
    // =====================================

    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        () => {


          localStorage.removeItem(
            "fridgeUser"
          );


          location.reload();

        }
      );



    // =====================================
    // 既にログイン済みなら自動ログイン
    // =====================================

    if (currentUser) {

      showApp();

    }



    // =====================================
    // 食品追加
    // =====================================

    document
      .getElementById("addButton")
      .addEventListener(
        "click",
        async () => {


          const name =
            document
              .getElementById("foodName")
              .value
              .trim();


          const quantity =
            Number(
              document
                .getElementById("quantity")
                .value
            );


          const location =
            document
              .getElementById("location")
              .value;


          const bestBefore =
            document
              .getElementById("bestBefore")
              .value;


          const useBy =
            document
              .getElementById("useBy")
              .value;


          const size =
            document
              .getElementById("size")
              .value;



          // 食品名チェック

          if (!name) {

            alert(
              "食品名を入力してください"
            );

            return;

          }



          // 個数チェック

          if (
            !quantity ||
            quantity < 1
          ) {

            alert(
              "個数を正しく入力してください"
            );

            return;

          }



          try {


            await addDoc(
              collection(
                db,
                "foods"
              ),
              {


                name:
                  name,


                quantity:
                  quantity,


                location:
                  location,


                bestBefore:
                  bestBefore ||
                  null,


                useBy:
                  useBy ||
                  null,


                size:
                  size,


                addedBy:
                  currentUser,


                createdAt:
                  serverTimestamp()


              }
            );



            // 入力欄をリセット

            document
              .getElementById(
                "foodName"
              )
              .value = "";


            document
              .getElementById(
                "quantity"
              )
              .value = 1;


            document
              .getElementById(
                "bestBefore"
              )
              .value = "";


            document
              .getElementById(
                "useBy"
              )
              .value = "";



          } catch (error) {


            console.error(error);


            alert(
              "食品を追加できませんでした。\n\n" +
              error.message
            );


          }

        }
      );



    // =====================================
    // Firebaseリアルタイム監視
    // =====================================

    function startRealtimeListener() {


      const foodsQuery =
        query(
          collection(
            db,
            "foods"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        );



      onSnapshot(
        foodsQuery,

        snapshot => {


          const foods = [];


          snapshot.forEach(
            document => {


              foods.push({

                id:
                  document.id,

                ...document.data()

              });


            }
          );



          renderFoods(foods);


        },


        error => {


          console.error(error);


          alert(
            "データを読み込めませんでした。\n\n" +
            error.message
          );


        }

      );

    }



    // =====================================
    // 食品を表示
    // =====================================

    function renderFoods(foods) {


      const containers = {


        "冷蔵室":
          document.getElementById(
            "coldFoods"
          ),


        "冷凍室":
          document.getElementById(
            "freezerFoods"
          ),


        "野菜室":
          document.getElementById(
            "vegetableFoods"
          )


      };



      // 全部クリア

      Object.values(
        containers
      ).forEach(
        container => {

          container.innerHTML = "";

        }
      );



      // 充満率

      const used = {

        "冷蔵室": 0,

        "冷凍室": 0,

        "野菜室": 0

      };



      foods.forEach(food => {


        const container =
          containers[
            food.location
          ];


        if (!container) return;



        // =================================
        // 充満率計算
        // =================================

        let point = 5;


        if (
          food.size === "medium"
        ) {

          point = 10;

        }


        if (
          food.size === "large"
        ) {

          point = 18;

        }


        used[
          food.location
        ] +=
          point *
          (food.quantity || 1);



        // =================================
        // 食品カード
        // =================================

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "food";



        const info =
          document.createElement(
            "div"
          );



        const name =
          document.createElement(
            "div"
          );


        name.className =
          "food-name";


        name.textContent =
          `${food.name} × ${food.quantity}`;



        const detail =
          document.createElement(
            "div"
          );


        detail.className =
          "food-info";



        // =================================
        // 期限表示
        // =================================

        let deadlineText = "";



        if (food.useBy) {


          deadlineText =
            `消費期限：${formatDate(
              food.useBy
            )}`;


        } else if (
          food.bestBefore
        ) {


          deadlineText =
            `賞味期限：${formatDate(
              food.bestBefore
            )}`;


        } else {


          deadlineText =
            "期限：未登録";


        }



        detail.textContent =
          deadlineText;



        // =================================
        // 期限チェック
        // =================================

        const deadline =
          food.useBy ||
          food.bestBefore;



        if (deadline) {


          const today =
            new Date();


          today.setHours(
            0,
            0,
            0,
            0
          );


          const date =
            new Date(
              deadline
            );


          date.setHours(
            0,
            0,
            0,
            0
          );


          const diff =
            Math.ceil(
              (
                date - today
              )
              /
              (
                1000 *
                60 *
                60 *
                24
              )
            );



          if (diff < 0) {


            detail.classList.add(
              "expired"
            );


            detail.textContent +=
              "　⚠️ 期限切れ";


          } else if (
            diff <= 3
          ) {


            detail.classList.add(
              "warning"
            );


            if (diff === 0) {


              detail.textContent +=
                "　⚠️ 今日まで";


            } else {


              detail.textContent +=
                `　⚠️ あと${diff}日`;


            }

          }

        }



        // =================================
        // 追加した人
        // =================================

        const addedBy =
          document.createElement(
            "div"
          );


        addedBy.className =
          "food-info";


        addedBy.textContent =
          `追加：${food.addedBy || "不明"}`;



        info.appendChild(
          name
        );


        info.appendChild(
          detail
        );


        info.appendChild(
          addedBy
        );



        // =================================
        // 削除ボタン
        // =================================

        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.className =
          "delete";


        deleteButton.textContent =
          "削除";



        deleteButton.addEventListener(
          "click",
          async () => {


            const ok =
              confirm(
                `${food.name}を削除しますか？`
              );


            if (!ok) return;



            try {


              await deleteDoc(
                doc(
                  db,
                  "foods",
                  food.id
                )
              );


            } catch (error) {


              console.error(
                error
              );


              alert(
                "削除できませんでした。\n\n" +
                error.message
              );


            }

          }
        );



        div.appendChild(
          info
        );


        div.appendChild(
          deleteButton
        );


        container.appendChild(
          div
        );


      });



      // =================================
      // 空のとき
      // =================================

      Object.entries(
        containers
      ).forEach(
        ([location, container]) => {


          if (
            container.children.length === 0
          ) {


            const empty =
              document.createElement(
                "div"
              );


            empty.className =
              "empty";


            empty.textContent =
              "まだ食品がありません";


            container.appendChild(
              empty
            );

          }

        }
      );



      // =================================
      // 充満率を更新
      // =================================

      updateCapacity(
        "coldRate",
        "coldBar",
        used["冷蔵室"]
      );


      updateCapacity(
        "freezerRate",
        "freezerBar",
        used["冷凍室"]
      );


      updateCapacity(
        "vegetableRate",
        "vegetableBar",
        used["野菜室"]
      );

    }



    // =====================================
    // 充満率
    // =====================================

    function updateCapacity(
      labelId,
      barId,
      value
    ) {


      const rate =
        Math.min(
          Math.round(value),
          100
        );


      document
        .getElementById(
          labelId
        )
        .textContent =
        `${rate}%`;


      document
        .getElementById(
          barId
        )
        .style.width =
        `${rate}%`;

    }



    // =====================================
    // 日付
    // =====================================

    function formatDate(
      dateString
    ) {


      const date =
        new Date(
          dateString
        );


      return (

        `${date.getFullYear()}/` +

        `${date.getMonth() + 1}/` +

        `${date.getDate()}`

      );

    }


  </script>

</body>

</html>
