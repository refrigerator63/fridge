<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Fridge</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fa;
      color: #222;
    }

    header {
      background: white;
      padding: 16px 20px;

      border-bottom: 1px solid #ddd;

      display: flex;
      justify-content: space-between;
      align-items: center;

      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;

      box-shadow:
        0 3px 15px rgba(0, 0, 0, 0.05);
    }


    /* =========================
       ログイン
       ========================= */

    .login {
      max-width: 420px;
      margin: 80px auto;
      text-align: center;
    }

    .login h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .user-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .user-button {
      background: #f1f3f5;
      color: #222;

      border: 2px solid transparent;

      padding: 18px 10px;
      border-radius: 14px;

      cursor: pointer;
      font-size: 16px;
      margin: 0;
    }

    .user-button.selected {
      border-color: #222;
      background: white;
    }

    .login-button {
      margin-top: 20px;
      background: #222;
      color: white;
    }


    /* =========================
       入力
       ========================= */

    input,
    button {
      width: 100%;
      padding: 13px;

      border-radius: 11px;
      border: 1px solid #ccc;

      font-size: 16px;
    }

    button {
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    label {
      display: block;
      font-size: 14px;
      color: #555;

      margin-top: 12px;
      margin-bottom: 5px;
    }


    /* =========================
       期限ボタン
       ========================= */

    .date-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .date-button {
      background: #f1f3f5;
      color: #222;

      text-align: left;

      min-height: 65px;
      padding: 12px;
    }

    .date-button .date-title {
      font-size: 13px;
      color: #666;
    }

    .date-button .date-value {
      font-size: 16px;
      font-weight: 600;
      margin-top: 3px;
    }


    /* =========================
       食品
       ========================= */

    .food {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 10px;

      border: 1px solid #eee;
      padding: 15px;

      border-radius: 13px;
      margin-bottom: 9px;

      background: white;
    }

    .food-name {
      font-weight: bold;
      font-size: 17px;
    }

    .food-info {
      font-size: 13px;
      color: #666;

      margin-top: 4px;
      line-height: 1.6;
    }

    .delete {
      width: auto;
      min-width: 55px;

      background: #eee;
      color: #c00;

      padding: 8px 12px;
      margin: 0;

      flex-shrink: 0;
    }

    .expired {
      color: #d00;
      font-weight: bold;
    }

    .warning {
      color: #d97706;
      font-weight: bold;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 20px;
    }

    .current-user {
      font-size: 13px;
      color: #666;
    }

    .logout {
      width: auto;
      padding: 8px 12px;

      background: #eee;
      color: #222;

      margin: 0;
    }


    /* =========================
       日付モーダル
       ========================= */

    .modal-background {
      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.45);

      display: flex;
      justify-content: center;
      align-items: flex-end;

      z-index: 100;
    }

    .modal {
      width: 100%;
      max-width: 600px;

      background: #f5f5f7;

      border-radius: 22px 22px 0 0;

      padding: 18px 15px 25px;

      animation: modalUp 0.2s ease;
    }

    @keyframes modalUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 15px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .modal-close {
      width: auto;

      background: #ddd;
      color: #333;

      padding: 7px 12px;
      margin: 0;
    }


    /* =========================
       iOS風ホイール
       ========================= */

    .wheel-container {
      position: relative;

      display: grid;
      grid-template-columns:
        1.2fr
        1fr
        1fr;

      height: 190px;

      overflow: hidden;

      background: #f5f5f7;

      border-radius: 15px;
    }

    .wheel {
      height: 190px;

      overflow-y: scroll;

      scroll-snap-type: y mandatory;

      scrollbar-width: none;

      -webkit-overflow-scrolling: touch;

      text-align: center;

      position: relative;
    }

    .wheel::-webkit-scrollbar {
      display: none;
    }

    .wheel-item {
      height: 38px;

      display: flex;
      justify-content: center;
      align-items: center;

      scroll-snap-align: center;

      font-size: 21px;

      color: #777;

      user-select: none;
    }

    .wheel-item.selected {
      color: #111;
      font-weight: 600;
    }

    .wheel-selection {
      position: absolute;

      left: 0;
      right: 0;

      top: 76px;

      height: 38px;

      border-top: 1px solid #ccc;
      border-bottom: 1px solid #ccc;

      pointer-events: none;
    }

    .wheel-fade {
      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          #f5f5f7 0%,
          rgba(245,245,247,0) 35%,
          rgba(245,245,247,0) 65%,
          #f5f5f7 100%
        );
    }


    /* =========================
       モーダルボタン
       ========================= */

    .modal-buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 15px;
    }

    .clear-button {
      background: #ddd;
      color: #333;
    }

    .save-date-button {
      background: #222;
      color: white;
    }


    @media (max-width: 500px) {

      main {
        padding: 12px;
      }

      .date-buttons {
        grid-template-columns: 1fr;
      }

      .modal {
        padding-bottom: 30px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       ログイン
       ========================= -->

  <div id="loginScreen">

    <div class="card login">

      <h1>🧊 My Fridge</h1>

      <p>
        家族用冷蔵庫管理システム
      </p>

      <h3>
        誰が使いますか？
      </h3>

      <div class="user-buttons">

        <button
          class="user-button"
          data-user="お父さん"
        >
          👨 お父さん
        </button>

        <button
          class="user-button"
          data-user="お母さん"
        >
          👩 お母さん
        </button>

        <button
          class="user-button"
          data-user="自分"
        >
          🧑 自分
        </button>

        <button
          class="user-button"
          data-user="その他"
        >
          👤 その他
        </button>

      </div>

      <button
        id="loginButton"
        class="login-button"
      >
        ログイン
      </button>

    </div>

  </div>



  <!-- =========================
       アプリ
       ========================= -->

  <div
    id="app"
    class="hidden"
  >

    <header>

      <div>

        <h1>
          🧊 My Fridge
        </h1>

        <div
          id="currentUser"
          class="current-user"
        ></div>

      </div>

      <button
        id="logoutButton"
        class="logout"
      >
        ログアウト
      </button>

    </header>


    <main>


      <!-- =========================
           食品追加
           ========================= -->

      <div class="card">

        <h2>
          ＋ 食品を追加
        </h2>


        <label>
          食品名
        </label>

        <input
          id="foodName"
          type="text"
          placeholder="例：卵"
        >


        <label>
          個数
        </label>

        <input
          id="quantity"
          type="number"
          min="0"
          value="1"
        >


        <label>
          グラム数
        </label>

        <input
          id="grams"
          type="number"
          min="0"
          placeholder="例：300"
        >


        <label>
          期限
        </label>


        <div class="date-buttons">


          <button
            id="bestBeforeButton"
            class="date-button"
          >

            <div class="date-title">
              賞味期限
            </div>

            <div
              id="bestBeforeText"
              class="date-value"
            >
              未設定
            </div>

          </button>


          <button
            id="useByButton"
            class="date-button"
          >

            <div class="date-title">
              消費期限
            </div>

            <div
              id="useByText"
              class="date-value"
            >
              未設定
            </div>

          </button>


        </div>


        <button
          id="addButton"
          style="margin-top:15px;"
        >
          冷蔵庫に追加
        </button>

      </div>



      <!-- =========================
           食品一覧
           ========================= -->

      <div class="card">

        <h2>
          🧊 冷蔵庫の中身
        </h2>

        <div id="foods"></div>

      </div>


    </main>

  </div>



  <!-- =========================
       日付モーダル
       ========================= -->

  <div
    id="dateModal"
    class="modal-background hidden"
  >

    <div class="modal">


      <div class="modal-header">

        <h2 id="modalTitle">
          賞味期限
        </h2>

        <button
          id="closeModal"
          class="modal-close"
        >
          閉じる
        </button>

      </div>


      <div class="wheel-container">


        <!-- 年 -->

        <div
          id="yearWheel"
          class="wheel"
        ></div>


        <!-- 月 -->

        <div
          id="monthWheel"
          class="wheel"
        ></div>


        <!-- 日 -->

        <div
          id="dayWheel"
          class="wheel"
        ></div>


        <div class="wheel-selection"></div>

        <div class="wheel-fade"></div>

      </div>


      <div class="modal-buttons">

        <button
          id="clearDate"
          class="clear-button"
        >
          期限なし
        </button>

        <button
          id="saveDate"
          class="save-date-button"
        >
          設定
        </button>

      </div>


    </div>

  </div>



  <!-- =========================
       Firebase
       ========================= -->

  <script type="module">


    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


    /* =========================
       Firebase設定
       ========================= */

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyB8DRhjiburjP3jKn4wDW2dmdLi843L0go",
      authDomain: "fridge-68cfc.firebaseapp.com",
      projectId: "fridge-68cfc",
      storageBucket: "fridge-68cfc.firebasestorage.app",
      messagingSenderId: "492169932952",
      appId: "1:492169932952:web:ba607e6e5d0db4700aa0ed",
      measurementId: "G-66TKL6ENX8"
    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);



    /* =========================
       現在のユーザー
       ========================= */

    let currentUser =
      localStorage.getItem(
        "fridgeUser"
      );


    let selectedBestBefore = null;

    let selectedUseBy = null;



    /* =========================
       HTML
       ========================= */

    const loginScreen =
      document.getElementById(
        "loginScreen"
      );

    const appScreen =
      document.getElementById(
        "app"
      );

    const currentUserText =
      document.getElementById(
        "currentUser"
      );



    /* =========================
       ユーザー選択
       ========================= */

    const userButtons =
      document.querySelectorAll(
        ".user-button"
      );


    userButtons.forEach(button => {

      button.addEventListener(
        "click",
        () => {

          userButtons.forEach(
            b =>
              b.classList.remove(
                "selected"
              )
          );

          button.classList.add(
            "selected"
          );

          currentUser =
            button.dataset.user;

        }
      );

    });



    /* =========================
       ログイン
       ========================= */

    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        () => {

          if (!currentUser) {

            alert(
              "名前を選択してください"
            );

            return;

          }

          localStorage.setItem(
            "fridgeUser",
            currentUser
          );

          showApp();

        }
      );



    function showApp() {

      loginScreen.classList.add(
        "hidden"
      );

      appScreen.classList.remove(
        "hidden"
      );

      currentUserText.textContent =
        `ログイン中：${currentUser}`;

      startRealtimeListener();

    }



    /* =========================
       ログアウト
       ========================= */

    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        () => {

          localStorage.removeItem(
            "fridgeUser"
          );

          location.reload();

        }
      );



    if (currentUser) {

      showApp();

    }



    /* =========================
       日付関係
       ========================= */

    let editingDateType = null;



    const dateModal =
      document.getElementById(
        "dateModal"
      );


    const modalTitle =
      document.getElementById(
        "modalTitle"
      );


    const yearWheel =
      document.getElementById(
        "yearWheel"
      );


    const monthWheel =
      document.getElementById(
        "monthWheel"
      );


    const dayWheel =
      document.getElementById(
        "dayWheel"
      );



    /* =========================
       今日＋2日
       ========================= */

    function getDefaultDate() {

      const date =
        new Date();

      date.setHours(
        0,
        0,
        0,
        0
      );

      date.setDate(
        date.getDate() + 2
      );

      return date;

    }



    /* =========================
       日付モーダルを開く
       ========================= */

    function openDateModal(type) {

      editingDateType = type;


      modalTitle.textContent =
        type === "bestBefore"
          ? "賞味期限"
          : "消費期限";


      let currentDate;


      if (
        type === "bestBefore" &&
        selectedBestBefore
      ) {

        currentDate =
          parseDate(selectedBestBefore);

      } else if (
        type === "useBy" &&
        selectedUseBy
      ) {

        currentDate =
          parseDate(selectedUseBy);

      } else {

        currentDate =
          getDefaultDate();

      }


      createWheels(currentDate);


      dateModal.classList.remove(
        "hidden"
      );

    }



    /* =========================
       ホイール生成
       ========================= */

    function createWheels(date) {

      const year =
        date.getFullYear();

      const month =
        date.getMonth() + 1;

      const day =
        date.getDate();


      yearWheel.innerHTML = "";

      monthWheel.innerHTML = "";

      dayWheel.innerHTML = "";



      // 年

      for (
        let y = year - 5;
        y <= year + 10;
        y++
      ) {

        addWheelItem(
          yearWheel,
          y,
          `${y}年`,
          y === year
        );

      }



      // 月

      for (
        let m = 1;
        m <= 12;
        m++
      ) {

        addWheelItem(
          monthWheel,
          m,
          `${m}月`,
          m === month
        );

      }



      // 日

      const maxDay =
        new Date(
          year,
          month,
          0
        ).getDate();


      for (
        let d = 1;
        d <= maxDay;
        d++
      ) {

        addWheelItem(
          dayWheel,
          d,
          `${d}日`,
          d === day
        );

      }


      // 選択位置へ移動

      setTimeout(() => {

        scrollToSelected(
          yearWheel
        );

        scrollToSelected(
          monthWheel
        );

        scrollToSelected(
          dayWheel
        );

      }, 10);

    }



    function addWheelItem(
      wheel,
      value,
      text,
      selected
    ) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "wheel-item";


      if (selected) {

        item.classList.add(
          "selected"
        );

      }


      item.dataset.value =
        value;


      item.textContent =
        text;


      wheel.appendChild(
        item
      );

    }



    function scrollToSelected(
      wheel
    ) {

      const selected =
        wheel.querySelector(
          ".selected"
        );


      if (!selected) return;


      selected.scrollIntoView({
        block: "center"
      });

    }



    /* =========================
       ホイールから値取得
       ========================= */

    function getWheelValue(
      wheel
    ) {

      const items =
        [
          ...wheel.children
        ];


      const center =
        wheel.getBoundingClientRect()
          .top
        +
        wheel.clientHeight / 2;


      let closest = null;

      let distance =
        Infinity;


      items.forEach(item => {

        const rect =
          item.getBoundingClientRect();

        const itemCenter =
          rect.top +
          rect.height / 2;

        const d =
          Math.abs(
            center -
            itemCenter
          );


        if (d < distance) {

          distance = d;

          closest = item;

        }

      });


      return Number(
        closest.dataset.value
      );

    }



    /* =========================
       日付モーダル
       ========================= */

    document
      .getElementById(
        "bestBeforeButton"
      )
      .addEventListener(
        "click",
        () => {

          openDateModal(
            "bestBefore"
          );

        }
      );


    document
      .getElementById(
        "useByButton"
      )
      .addEventListener(
        "click",
        () => {

          openDateModal(
            "useBy"
          );

        }
      );



    document
      .getElementById(
        "closeModal"
      )
      .addEventListener(
        "click",
        () => {

          dateModal.classList.add(
            "hidden"
          );

        }
      );



    /* =========================
       日付設定
       ========================= */

    document
      .getElementById(
        "saveDate"
      )
      .addEventListener(
        "click",
        () => {

          const year =
            getWheelValue(
              yearWheel
            );

          const month =
            getWheelValue(
              monthWheel
            );

          const day =
            getWheelValue(
              dayWheel
            );


          const date =
            createDateString(
              year,
              month,
              day
            );


          if (
            editingDateType ===
            "bestBefore"
          ) {

            selectedBestBefore =
              date;

            document
              .getElementById(
                "bestBeforeText"
              )
              .textContent =
              formatJapaneseDate(
                date
              );

          } else {

            selectedUseBy =
              date;

            document
              .getElementById(
                "useByText"
              )
              .textContent =
              formatJapaneseDate(
                date
              );

          }


          dateModal.classList.add(
            "hidden"
          );

        }
      );



    /* =========================
       期限なし
       ========================= */

    document
      .getElementById(
        "clearDate"
      )
      .addEventListener(
        "click",
        () => {

          if (
            editingDateType ===
            "bestBefore"
          ) {

            selectedBestBefore =
              null;

            document
              .getElementById(
                "bestBeforeText"
              )
              .textContent =
              "未設定";

          } else {

            selectedUseBy =
              null;

            document
              .getElementById(
                "useByText"
              )
              .textContent =
              "未設定";

          }


          dateModal.classList.add(
            "hidden"
          );

        }
      );



    /* =========================
       日付文字列
       ========================= */

    function createDateString(
      year,
      month,
      day
    ) {

      return (
        `${year}-` +
        `${String(month).padStart(2, "0")}-` +
        `${String(day).padStart(2, "0")}`
      );

    }



    function parseDate(
      dateString
    ) {

      const [
        y,
        m,
        d
      ] =
        dateString
          .split("-")
          .map(Number);


      return new Date(
        y,
        m - 1,
        d
      );

    }



    function formatJapaneseDate(
      dateString
    ) {

      const date =
        parseDate(
          dateString
        );


      return (
        `${date.getFullYear()}年` +
        `${date.getMonth() + 1}月` +
        `${date.getDate()}日`
      );

    }



    /* =========================
       食品追加
       ========================= */

    document
      .getElementById(
        "addButton"
      )
      .addEventListener(
        "click",
        async () => {

          const name =
            document
              .getElementById(
                "foodName"
              )
              .value
              .trim();


          const quantity =
            Number(
              document
                .getElementById(
                  "quantity"
                )
                .value
            );


          const gramsInput =
            document
              .getElementById(
                "grams"
              )
              .value;


          const grams =
            gramsInput === ""
              ? null
              : Number(
                  gramsInput
                );


          if (!name) {

            alert(
              "食品名を入力してください"
            );

            return;

          }


          if (
            quantity < 0
          ) {

            alert(
              "個数を正しく入力してください"
            );

            return;

          }


          if (
            grams !== null &&
            grams < 0
          ) {

            alert(
              "グラム数を正しく入力してください"
            );

            return;

          }


          try {

            await addDoc(
              collection(
                db,
                "foods"
              ),
              {

                name:
                  name,

                quantity:
                  quantity,

                grams:
                  grams,

                bestBefore:
                  selectedBestBefore,

                useBy:
                  selectedUseBy,

                addedBy:
                  currentUser,

                createdAt:
                  serverTimestamp()

              }
            );


            // リセット

            document
              .getElementById(
                "foodName"
              )
              .value = "";


            document
              .getElementById(
                "quantity"
              )
              .value = 1;


            document
              .getElementById(
                "grams"
              )
              .value = "";


            selectedBestBefore =
              null;

            selectedUseBy =
              null;


            document
              .getElementById(
                "bestBeforeText"
              )
              .textContent =
              "未設定";


            document
              .getElementById(
                "useByText"
              )
              .textContent =
              "未設定";


          } catch (error) {

            console.error(
              error
            );

            alert(
              "食品を追加できませんでした。\n\n" +
              error.message
            );

          }

        }
      );



    /* =========================
       Firestoreリアルタイム同期
       ========================= */

    function startRealtimeListener() {

      const foodsQuery =
        query(
          collection(
            db,
            "foods"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        );


      onSnapshot(
        foodsQuery,

        snapshot => {

          const foods = [];


          snapshot.forEach(
            document => {

              foods.push({

                id:
                  document.id,

                ...document.data()

              });

            }
          );


          renderFoods(
            foods
          );

        },

        error => {

          console.error(
            error
          );

          alert(
            "データを読み込めませんでした。\n\n" +
            error.message
          );

        }
      );

    }



    /* =========================
       食品表示
       ========================= */

    function renderFoods(
      foods
    ) {

      const container =
        document.getElementById(
          "foods"
        );


      container.innerHTML = "";


      if (
        foods.length === 0
      ) {

        container.innerHTML =
          `
          <div class="empty">
            冷蔵庫に食品がありません
          </div>
          `;

        return;

      }



      foods.forEach(
        food => {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "food";


          const info =
            document.createElement(
              "div"
            );


          const name =
            document.createElement(
              "div"
            );


          name.className =
            "food-name";


          let quantityText =
            `個数：${food.quantity ?? 0}個`;


          if (
            food.grams !== null &&
            food.grams !== undefined
          ) {

            quantityText +=
              `　${food.grams}g`;

          }


          name.textContent =
            `${food.name}`;



          const detail =
            document.createElement(
              "div"
            );


          detail.className =
            "food-info";


          detail.textContent =
            quantityText;



          const deadline =
            food.useBy ||
            food.bestBefore;


          if (deadline) {

            const type =
              food.useBy
                ? "消費期限"
                : "賞味期限";


            const deadlineDate =
              parseDate(
                deadline
              );


            const today =
              new Date();


            today.setHours(
              0,
              0,
              0,
              0
            );


            const diff =
              Math.ceil(
                (
                  deadlineDate -
                  today
                )
                /
                (
                  1000 *
                  60 *
                  60 *
                  24
                )
              );


            detail.textContent +=
              `\n${type}：` +
              formatJapaneseDate(
                deadline
              );


            if (
              diff < 0
            ) {

              detail.classList.add(
                "expired"
              );

              detail.textContent +=
                "　⚠️ 期限切れ";

            } else if (
              diff <= 3
            ) {

              detail.classList.add(
                "warning"
              );

              if (
                diff === 0
              ) {

                detail.textContent +=
                  "　⚠️ 今日まで";

              } else {

                detail.textContent +=
                  `　⚠️ あと${diff}日`;

              }

            }

          } else {

            detail.textContent +=
              "\n期限：未設定";

          }



          const addedBy =
            document.createElement(
              "div"
            );


          addedBy.className =
            "food-info";


          addedBy.textContent =
            `追加：${food.addedBy || "不明"}`;



          info.appendChild(
            name
          );

          info.appendChild(
            detail
          );

          info.appendChild(
            addedBy
          );



          const deleteButton =
            document.createElement(
              "button"
            );


          deleteButton.className =
            "delete";


          deleteButton.textContent =
            "削除";


          deleteButton.addEventListener(
            "click",
            async () => {

              if (
                !confirm(
                  `${food.name}を削除しますか？`
                )
              ) {

                return;

              }


              try {

                await deleteDoc(
                  doc(
                    db,
                    "foods",
                    food.id
                  )
                );

              } catch (error) {

                console.error(
                  error
                );

                alert(
                  "削除できませんでした。\n\n" +
                  error.message
                );

              }

            }
          );



          div.appendChild(
            info
          );

          div.appendChild(
            deleteButton
          );


          container.appendChild(
            div
          );

        }
      );

    }

  </script>
